workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - when: never

variables:
  IMAGE_TAG_SHA: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  IMAGE_TAG_COMMIT: $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG

stages:
  - validate
  - build
  - tag


validate_tag:
  stage: validate
  script:
    - echo "$CI_COMMIT_TAG" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$'
  rules:
    - if: $CI_COMMIT_TAG
    - when: never


build_image:
  stage: build
  image: docker:28
  services:
    - name: docker:28-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

    - |
      if docker pull "$IMAGE_TAG_SHA"; then
        echo "Image already exists, skipping build"
      else
        docker build --pull -t "$IMAGE_TAG_SHA" .
        docker push "$IMAGE_TAG_SHA"
      fi

  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG


tag_release:
  stage: tag
  image: docker:28
  services:
    - name: docker:28-dind
      command: ["--tls=false"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  needs: [validate_tag, build_image]
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

    - docker pull "$IMAGE_TAG_SHA"
    - docker tag "$IMAGE_TAG_SHA" "$IMAGE_TAG_COMMIT"
    - docker push "$IMAGE_TAG_COMMIT"

  rules:
    - if: $CI_COMMIT_TAG

